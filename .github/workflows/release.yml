name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Generate changelog
        id: changelog
        run: |
          # Get all tags sorted by version (newest first)
          TAGS=($(git tag --sort=-version:refname))
          
          if [ ${#TAGS[@]} -eq 0 ]; then
            echo "First release - showing all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          elif [ ${#TAGS[@]} -eq 1 ]; then
            # Only current tag exists
            PREV_TAG=""
            CHANGELOG=$(git log ${TAGS[0]}^..HEAD --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Compare with previous tag
            PREV_TAG=${TAGS[1]}
            echo "Changes since $PREV_TAG"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Save changelog to file
          echo "$CHANGELOG" > CHANGELOG.txt
          
          # Also set as output (with escaped newlines)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body: |
            ## What's Changed
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Downloads
            - Android APKs are available as release assets below
            - See build artifacts for additional outputs
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release-android:
    name: Build Release Android APKs
    runs-on: ubuntu-latest
    needs: create-release
    timeout-minutes: 30
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~/.pub-cache
          key: pub-release-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-release-${{ runner.os }}-
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Create production environment file
        run: |
          # Create .env file with production Firebase credentials from secrets
          # Common settings
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID || 'test-project' }}" > .env
          echo "FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '123' }}" >> .env
          echo "FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL || 'https://test-project.firebaseio.com' }}" >> .env
          echo "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET || 'test-project.appspot.com' }}" >> .env
          echo "FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN || 'test-project.firebaseapp.com' }}" >> .env
          
          # Android
          echo "FIREBASE_API_KEY_ANDROID=${{ secrets.FIREBASE_API_KEY_ANDROID || 'test-key' }}" >> .env
          echo "FIREBASE_APP_ID_ANDROID=${{ secrets.FIREBASE_APP_ID_ANDROID || '1:123:android:test' }}" >> .env
          
          # iOS
          echo "FIREBASE_API_KEY_IOS=${{ secrets.FIREBASE_API_KEY_IOS || 'test-key' }}" >> .env
          echo "FIREBASE_APP_ID_IOS=${{ secrets.FIREBASE_APP_ID_IOS || '1:123:ios:test' }}" >> .env
          echo "FIREBASE_IOS_BUNDLE_ID=${{ secrets.FIREBASE_IOS_BUNDLE_ID || 'com.jspl.dyip' }}" >> .env
          
          # Web
          echo "FIREBASE_API_KEY_WEB=${{ secrets.FIREBASE_API_KEY_WEB || 'test-key' }}" >> .env
          echo "FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB || '1:123:web:test' }}" >> .env
          echo "FIREBASE_MEASUREMENT_ID_WEB=${{ secrets.FIREBASE_MEASUREMENT_ID_WEB || 'G-XXXXXXXXXX' }}" >> .env
          
          # Windows
          echo "FIREBASE_API_KEY_WINDOWS=${{ secrets.FIREBASE_API_KEY_WINDOWS || 'test-key' }}" >> .env
          echo "FIREBASE_APP_ID_WINDOWS=${{ secrets.FIREBASE_APP_ID_WINDOWS || '1:123:windows:test' }}" >> .env
          echo "FIREBASE_MEASUREMENT_ID_WINDOWS=${{ secrets.FIREBASE_MEASUREMENT_ID_WINDOWS || 'G-XXXXXXXXXX' }}" >> .env
      
      - name: Update version in pubspec.yaml
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          BUILD_NUMBER=$(date +%s)
          # Use -i.bak for portability; delete backup after
          sed -i.bak "s/^version:.*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          rm pubspec.yaml.bak
          echo "Updated version to ${VERSION}+${BUILD_NUMBER}"
      
      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release
      
      - name: Build Android APK (Release)
        run: flutter build apk --release --split-per-abi
      
      - name: Build Android APK (Fat APK)
        run: flutter build apk --release
      
      - name: Rename APKs with version
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cd build/app/outputs/flutter-apk
          
          # Rename split APKs with validation
          for apk in app-*-release.apk; do
            if [ -f "$apk" ]; then
              # Extract arch, ensuring it matches expected pattern
              arch=$(echo "$apk" | sed -E 's/app-([a-z0-9]+)-release\.apk/\1/')
              if [ -z "$arch" ] || [ "$arch" = "$apk" ]; then
                echo "Warning: Failed to parse arch from $apk"
                continue
              fi
              mv "$apk" "dyip-v${VERSION}-${arch}.apk"
              echo "Renamed: $apk → dyip-v${VERSION}-${arch}.apk"
            fi
          done
          
          # Rename fat APK with explicit check
          if [ -f "app-release.apk" ]; then
            mv "app-release.apk" "dyip-v${VERSION}-universal.apk"
            echo "Renamed: app-release.apk → dyip-v${VERSION}-universal.apk"
          else
            echo "Warning: app-release.apk not found"
          fi
          
          # Verify outputs exist
          if ! ls dyip-v${VERSION}-*.apk >/dev/null 2>&1; then
            echo "Error: No APKs found after renaming" >&2
            exit 1
          fi
          
          ls -lh
      
      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            build/app/outputs/flutter-apk/dyip-*.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-builds-v${{ needs.create-release.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 90

